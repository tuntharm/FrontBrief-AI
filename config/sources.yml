# Public metadata/content sources grouped by intelligence track.
# Keep enabled sources public and non-paywalled. Add paid sources only as
# disabled placeholders or as links to public/free pages.

defaults:
  lookback_hours: 48
  per_source_limit: 15
  request_timeout_seconds: 20

tracks:
  ai_infrastructure:
    - name: NVIDIA Press Room
      type: rss
      url: https://nvidianews.nvidia.com/releases.xml
      enabled: true

    - name: NVIDIA Blog
      type: rss
      url: https://feeds.feedburner.com/nvidiablog
      enabled: true

    - name: NVIDIA Developer Blog
      type: rss
      url: https://developer.nvidia.com/blog/feed
      enabled: true

    - name: AMD Investor Press Releases
      type: rss
      url: https://ir.amd.com/news-events/press-releases/rss
      enabled: true

    - name: TSMC Latest News
      type: url
      url: https://pr.tsmc.com/english/latest-news
      enabled: true
      include_url_patterns:
        - /english/news/

    - name: Broadcom Investor News
      type: rss
      url: https://investors.broadcom.com/rss/news-releases.xml
      enabled: true

    - name: Microsoft Azure AI Blog
      type: rss
      url: https://azure.microsoft.com/en-us/blog/topics/ai-machine-learning/feed/
