weights:
  phd_relevance: 0.30
  investment_relevance: 0.25
  technical_novelty: 0.20
  moat_implication: 0.15
  urgency: 0.10

score_scale:
  min: 0
  max: 5

inclusion_rules:
  min_weighted_score: 3.0
  min_raw_score: 15
  max_selected_items: 5
  fewer_strong_items_note_threshold: 3

guidance:
  include:
    - AI infrastructure economics, capex, utilisation, inference cost, memory, networking, data centre energy/cooling.
    - NVIDIA, AMD, TSMC, Broadcom, hyperscaler AI infrastructure, AI server supply chain.
    - Scientific machine learning, neural operators, graph neural networks for physics, PDE surrogates, FEA/CFD acceleration.
    - AI for aerospace, robotics, structural health monitoring, digital twins, engineering simulation.
    - Deeptech funding, acquisition, or talent movement that changes technical moats.
    - UK, Thailand, or Asia deeptech policy and commercialisation when strategically relevant.
  ignore:
    - Generic chatbot launches unless they change infrastructure economics or research capability.
    - Prompt-engineering tips, consumer AI tools, vague AI opinion pieces.
    - Low-signal VC thought leadership and duplicated coverage.
    - Marketing blogs without technical or market data.
    - Paywalled pages unless only public metadata is used.
