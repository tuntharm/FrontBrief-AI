name: Commit Poster

# Downloads the daily poster PNG from a Canva export URL and commits it.
# The routine (or a person) commits a pointer file `posters/YYYY-MM-DD-ai-brief.png.url`
# containing the Canva export URL; this workflow fetches it on GitHub's network
# (which can reach Canva) and commits the resulting PNG. This avoids depending on
# the routine container's egress allowlist for Canva hosts.

on:
  push:
    branches:
      - main
    paths:
      - "posters/**/*.png.url"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: commit-poster
  cancel-in-progress: false

jobs:
  commit-poster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download posters from .url pointers
        run: |
          shopt -s nullglob
          changed=0
          for f in posters/*.png.url; do
            png="${f%.url}"
            url="$(tr -d '\r\n' < "$f")"
            echo "Fetching $(basename "$png")"
            if curl -fSL --max-time 120 "$url" -o "$png"; then
              if file "$png" | grep -qi 'PNG image'; then
                rm -f "$f"
                changed=1
                echo "Committed-ready: $png"
              else
                echo "::warning::Downloaded file is not a PNG (URL may be expired): $png"
                rm -f "$png"
              fi
            else
              echo "::warning::Download failed for $png"
            fi
          done
          echo "changed=$changed" >> "$GITHUB_ENV"

      - name: Commit and push
        if: env.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A posters/
          git commit -m "Add daily AI brief poster image"
          git push
