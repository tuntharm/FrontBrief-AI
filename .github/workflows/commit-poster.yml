name: Commit Poster

# Production Codex runs now commit the Canva-exported PNG directly. This
# compatibility workflow remains only for historical Canva .png.url pointers.

on:
  push:
    branches:
      - main
    paths:
      - "social/poster/**/*.png.url"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: commit-poster
  cancel-in-progress: false

jobs:
  commit-poster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Download legacy Canva pointers
        run: |
          shopt -s nullglob
          changed=0
          for f in social/poster/*.png.url; do
            png="${f%.url}"
            url="$(tr -d '\r\n' < "$f")"
            echo "Fetching $(basename "$png")"
            curl -fSL --max-time 120 "$url" -o "$png"
            if ! file "$png" | grep -qi 'PNG image'; then
              echo "::error::Downloaded file is not a PNG: $png"
              exit 1
            fi
            rm -f "$f"
            changed=1
            echo "Committed-ready: $png"
          done
          echo "changed=$changed" >> "$GITHUB_ENV"

      - name: Commit and push
        if: env.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A social/poster/
          git commit -m "Add daily AI brief poster image"
          git push

      - name: Report no-op
        if: env.changed != '1'
        run: echo "No new poster inputs required rendering."
