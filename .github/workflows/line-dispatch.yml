name: LINE Article Dispatch

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "articles/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: line-article-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-line:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract LINE digest
        run: python scripts/extract_line_digest.py

      - name: Send LINE message
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: python scripts/send_line.py
