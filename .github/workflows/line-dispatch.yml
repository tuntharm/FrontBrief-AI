name: LINE Article Dispatch

on:
  push:
    branches:
      - main
    paths:
      - "articles/**/*.md"
  workflow_dispatch:
    inputs:
      article:
        description: "Article path (blank = newest dated article)"
        required: false
        type: string
      dry_run:
        description: "Validate and extract without sending LINE"
        required: true
        default: true
        type: boolean
      connection_test:
        description: "Send a fixed Codex cutover test instead of an article"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: line-article-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-line:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test LINE connection
        if: github.event_name == 'workflow_dispatch' && inputs.connection_test
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--text "FrontBrief.AI Codex cutover test — LINE delivery is connected.")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/send_line.py "${args[@]}"

      - name: Resolve publish target
        id: target
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_ARTICLE: ${{ inputs.article }}
          CONNECTION_TEST: ${{ inputs.connection_test }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$CONNECTION_TEST" == "true" ]]; then
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            echo "Connection test handled separately; skipping article delivery."
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            article="$REQUESTED_ARTICLE"
            if [[ -z "$article" ]]; then
              article="$(find articles -maxdepth 1 -type f -name '????-??-??-ai-brief.md' | sort | tail -1)"
            fi
          else
            article="$(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$GITHUB_SHA" -- 'articles/*-ai-brief.md' | tail -1)"
          fi
          if [[ -z "$article" ]]; then
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            echo "No newly added daily article; skipping delivery."
            exit 0
          fi
          if [[ ! "$article" =~ ^articles/[0-9]{4}-[0-9]{2}-[0-9]{2}-ai-brief\.md$ ]]; then
            echo "::error::Invalid article path: $article"
            exit 1
          fi
          echo "article=$article" >> "$GITHUB_OUTPUT"
          echo "should_send=true" >> "$GITHUB_OUTPUT"

      - name: Run deterministic pre-publication gates
        if: steps.target.outputs.should_send == 'true' && github.event_name == 'push'
        env:
          ARTICLE: ${{ steps.target.outputs.article }}
        run: |
          stem="${ARTICLE#articles/}"
          stem="${stem%.md}"
          python scripts/validate_newsroom.py \
            --article "$ARTICLE" \
            --caption "social/caption/$stem.txt" \
            --poster-spec "social/poster/$stem.poster.json"

      - name: Extract LINE digest
        if: steps.target.outputs.should_send == 'true'
        run: python scripts/extract_line_digest.py --article "${{ steps.target.outputs.article }}"

      - name: Send LINE message
        if: steps.target.outputs.should_send == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" == "true" ]]; then
            python scripts/send_line.py --dry-run
          else
            python scripts/send_line.py
          fi
