name: Daily AI Deeptech Brief

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-deeptech-brief-${{ github.ref }}
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Europe/London hour
        id: london_time
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            current_hour="$(TZ=Europe/London date +'%H')"
            current_offset="$(TZ=Europe/London date +'%z')"
            trigger_schedule='${{ github.event.schedule }}'
            echo "Current Europe/London hour: ${current_hour}"
            if [ "${current_hour}" != "07" ]; then
              echo "Not 07:00 Europe/London; exiting cleanly."
              echo "should_run=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            if [ "${current_offset}" = "+0100" ]; then
              expected_schedule="0 6 * * *"
            elif [ "${current_offset}" = "+0000" ]; then
              expected_schedule="0 7 * * *"
            else
              echo "Unexpected Europe/London UTC offset: ${current_offset}"
              echo "should_run=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            if [ "${trigger_schedule}" != "${expected_schedule}" ]; then
              echo "Cron ${trigger_schedule} is not the active 07:00 Europe/London trigger for offset ${current_offset}; exiting cleanly."
              echo "should_run=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          echo "should_run=true" >> "${GITHUB_OUTPUT}"

      - name: Fetch candidate items
        if: steps.london_time.outputs.should_run == 'true'
        run: python scripts/fetch_news.py

      - name: Summarise and rank
        if: steps.london_time.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/summarise.py

      - name: Send LINE digest
        if: steps.london_time.outputs.should_run == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: python scripts/send_line.py

      - name: Commit generated reports
        if: steps.london_time.outputs.should_run == 'true'
        run: |
          report_date="$(TZ=Europe/London date +'%Y-%m-%d')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json reports/*.md reports/latest_line_digest.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add daily AI deeptech brief ${report_date}"
            git push
          fi
